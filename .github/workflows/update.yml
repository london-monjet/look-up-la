name: Update stargazing data

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours, UTC
  workflow_dispatch:         # adds a "Run workflow" button

permissions:
  contents: write            # lets the job commit the new data

concurrency:
  group: update-data         # never run two updates at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build tonight's data
        run: python src/update_data.py

      - name: Commit the new data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/tonight.geojson
          git diff --cached --quiet || (git commit -m "Update data" && git push)